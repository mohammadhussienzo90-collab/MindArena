version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindarena
      POSTGRES_USER: mindarena
      POSTGRES_PASSWORD: mindarena_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://mindarena:mindarena_dev@db:5432/mindarena
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_ENV=development
      - DEBUG=True
      - SECRET_KEY=dev-docker-secret-key-not-for-production
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_game_content --verbosity=0 2>/dev/null;
             python manage.py seed_achievements --verbosity=0 2>/dev/null;
             python manage.py runserver 0.0.0.0:8000"

  celery:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgres://mindarena:mindarena_dev@db:5432/mindarena
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_ENV=development
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info

volumes:
  pgdata:
